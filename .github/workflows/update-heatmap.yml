name: Update contribution heatmap

"on":
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [scripts/heatmap.py]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/heatmap.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg
          git diff --cached --quiet || { git commit -m "chore: refresh contribution heatmap [skip ci]" && git push; }
